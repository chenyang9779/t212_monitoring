services:
  monitor:
    build:
      context: .
    image: t212-monitoring:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      T212_DB_PATH: /app/data/monitor.db
    ports:
      - "${T212_BIND_ADDRESS:-0.0.0.0}:${T212_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    stop_grace_period: 10s
