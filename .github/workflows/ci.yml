name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      T212_API_KEY: ci-placeholder-key
      T212_API_SECRET: ci-placeholder-secret
      T212_ENV: demo
      T212_POLL_SECONDS: "6"
      T212_SNAPSHOT_SECONDS: "30"
      T212_DB_PATH: /tmp/t212-monitor-ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Import application
        run: python -c "import app.main; print(app.main.app.version)"

      - name: Run tests
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag t212-monitoring:ci .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name t212-monitoring-ci \
            --env T212_DEMO=true \
            --publish 127.0.0.1:18000:8000 \
            t212-monitoring:ci
          trap 'docker rm --force t212-monitoring-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/healthz >/tmp/healthz.json; then
              cat /tmp/healthz.json
              exit 0
            fi
            sleep 1
          done

          docker logs t212-monitoring-ci
          exit 1

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip && python -m pip install pip-audit

      - name: Run pip-audit
        run: python -m pip-audit --requirement requirements.txt

      - name: Install gitleaks
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) gitleaks_arch="amd64" ;;
            aarch64|arm64) gitleaks_arch="arm64" ;;
            *) gitleaks_arch="amd64" ;;
          esac
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_${gitleaks_arch}.tar.gz | tar xz -C /usr/local/bin gitleaks

      - name: Run gitleaks scan
        run: gitleaks detect --source . --log-opts="--all" --redact
